name: Refresh NFL EPA team-game feed
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_nfl_epa.py
      - .github/workflows/refresh-nfl-epa.yml
  schedule:
    # Twice daily during NFL season; processed source usually publishes by 09:00 UTC.
    - cron: '15 11,16 * 9-12 *'
    - cron: '15 11,16 * 1-2 *'
permissions:
  contents: write
concurrency:
  group: nfl-epa-feed
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build 26-column team-game feed
        env:
          NFL_SEASON: '2026'
        run: python scripts/build_nfl_epa.py
      - name: Commit latest feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl_2026_team_games.csv data/nfl_2026_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh 2026 NFL EPA team-game feed'
            git push
          fi
